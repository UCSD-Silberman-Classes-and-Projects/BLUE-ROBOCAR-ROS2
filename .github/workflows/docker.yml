# Build the rover image and push it to GitHub Container Registry (ghcr.io), so a
# Jetson can `docker pull` it instead of building for an hour.
#
#   docker pull ghcr.io/ucsd-silberman-classes-and-projects/blue-robocar-ros2:latest
#
# Tags pushed:
#   latest        every push to main
#   sha-<short>   every build, for pinning an exact commit
#   v1.2.3, 1.2   when a git tag v1.2.3 is pushed
#   cpu, cpu-...  same as above, CPU-only variant (BASE_IMAGE=ros:jazzy-ros-base)
#
# Built natively on GitHub's arm64 runner (linux/arm64, the Orin Nano's platform).
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/**"
      - "ros2_ws/**"
      - "scripts/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
            base_image: nvidia/cuda:13.2.1-runtime-ubuntu24.04
            suffix: ""
          - variant: cpu
            base_image: ros:jazzy-ros-base
            suffix: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Dockerfile builds Livox-SDK2 for one driver commit (LIVOX_DRIVER_REF).
      # A submodule pointer that drifted from it builds against the wrong SDK and
      # fails deep inside colcon; catch that here instead.
      - name: Check livox_ros_driver2 submodule matches the Dockerfile pin
        run: |
          pinned=$(sed -n 's/^ARG LIVOX_DRIVER_REF=//p' docker/Dockerfile)
          actual=$(git ls-tree HEAD ros2_ws/src/livox_ros_driver2 | awk '{print $3}')
          if [ "$pinned" != "$actual" ]; then
            echo "::error::livox_ros_driver2 submodule is at $actual but docker/Dockerfile pins LIVOX_DRIVER_REF=$pinned. Bump both together (with LIVOX_SDK2_REF), or reset the submodule: git update-index --cacheinfo 160000,$pinned,ros2_ws/src/livox_ros_driver2"
            exit 1
          fi

      # The CUDA image is large; the runner's preinstalled toolchains aren't needed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Image name (lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix && format('-{0}', matrix.suffix) || '' }},onlatest=false
          tags: |
            type=raw,value=${{ matrix.suffix || 'latest' }},enable={{is_default_branch}},suffix=
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          build-args: BASE_IMAGE=${{ matrix.base_image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
